name: PowerShell CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester ./tests -CI
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = foreach ($path in './src', './Start-PortAnalyzer.ps1') {
            Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reported errors.' }
